name: pocketchat-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketchat-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: pocketchat-ci (python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Record the runtime under test
        id: runtime
        shell: bash
        run: |
          python --version
          python -m pip --version
          echo "python=$(python --version)" >> "$GITHUB_OUTPUT"
          echo "pip=$(python -m pip --version)" >> "$GITHUB_OUTPUT"

      - name: Run the suite
        run: python -m unittest discover -s tests -v

      - name: Install the package into a clean venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pocketchat-clean"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PY="$RUNNER_TEMP/pocketchat-clean/Scripts/python.exe"
            CLI="$RUNNER_TEMP/pocketchat-clean/Scripts/pocketchat.exe"
          else
            PY="$RUNNER_TEMP/pocketchat-clean/bin/python"
            CLI="$RUNNER_TEMP/pocketchat-clean/bin/pocketchat"
          fi
          "$PY" -m pip install .
          "$CLI" --version
          "$CLI" --help

      - name: Write the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### pocketchat-ci (${{ matrix.os }}, ${{ steps.runtime.outputs.python }}, ${{ steps.runtime.outputs.pip }})"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- python: ${{ steps.runtime.outputs.python }}"
            echo "- event: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
